# Pings the Render backend so the free instance never spins down (it sleeps after 15 min idle).
name: Keep backend awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend
        run: curl -fsS --max-time 120 --retry 2 https://askcruz-mailbox-api.onrender.com/api/session || true
